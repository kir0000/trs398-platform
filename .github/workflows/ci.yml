name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trs_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: trs398
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U trs_owner -d trs398" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TRS_OWNER_PASSWORD: ci-owner-password
      TRS_APP_PASSWORD: ci-app-password
      TRS_READONLY_PASSWORD: ci-readonly-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Create database roles
        run: |
          PGPASSWORD=$TRS_OWNER_PASSWORD psql -h 127.0.0.1 -p 5433 -U trs_owner -d trs398 \
            -c "CREATE ROLE trs_app LOGIN PASSWORD '$TRS_APP_PASSWORD'" \
            -c "CREATE ROLE trs_readonly LOGIN PASSWORD '$TRS_READONLY_PASSWORD'"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/trs398-app
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # a tag vX.Y.Z makes a release: the image in ghcr.io and two packages (with and without the Docker images inside) for the computers
  # that have no Internet; the packages are copied to them by hand (see docs/PUBLISHING.md)
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version of the package = the tag
        run: echo "${GITHUB_REF_NAME#v}" > VERSION
      - name: Build the packages
        run: python tools/make_bundle.py "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
