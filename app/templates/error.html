{% extends "base.html" %}
{% block title %}Ошибка{% endblock %}
{% block content %}
<div class="card" style="max-width:640px;margin:40px auto">
  <h1>{{ {403: 'Нет доступа', 404: 'Не найдено', 409: 'Действие невозможно', 422: 'Проверьте данные', 429: 'Слишком много попыток'}.get(code, 'Ошибка') }}</h1>
  <p>{{ message }}</p>
  <p><a class="btn" href="javascript:history.back()">Назад</a> <a class="btn" href="/measurements">На главную</a></p>
</div>
{% endblock %}
